[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "a2c-research"
version = "0.1.0"
description = "Reproducible A2C/PPO training stability and hyperparameter sensitivity study"
requires-python = ">=3.10,<3.11"
dependencies = [
    "stable-baselines3==2.9.0",
    "gymnasium==1.4.0",
    "torch==2.10.0",
    "numpy==2.2.6",
    "pandas==2.3.3",
    "matplotlib==3.10.8",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.14.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
